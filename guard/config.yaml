name: Guard
version: "6.7.8"
slug: guard
description: "Network-wide ad and tracker blocking powered by Pi-hole"
url: "https://github.com/valentinekasilo-maker/guard"
panel_icon: mdi:shield-check
host_network: true
apparmor: false
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_NICE
  - SYS_TIME
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8085
ingress_entry: "index.html"
ingress_panel: true
hassio_api: true
ports:
  8085/tcp: 8085
  8088/tcp: 8088
  4865/tcp: 4865
ports_description:
  8085/tcp: "Primary web administration interface (direct LAN)"
  8088/tcp: "Secondary web administration interface (direct LAN)"
  4865/tcp: "Alternative web administration interface (direct LAN)"
schema:
  password: str?
  upstream_dns: str?
  domain: str?
options:
  password: "guard"
  upstream_dns: "1.1.1.1;1.0.0.1"
  domain: ""
