name: Guard
version: "6.6.9"
slug: guard
description: "Network-wide ad and tracker blocking powered by Pi-hole"
url: "https://github.com/valentinekasilo-maker/guard"
panel_icon: mdi:shield-check
host_network: true
apparmor: false
privileged:
  - NET_ADMIN
  - NET_RAW
  - SYS_NICE
  - SYS_TIME
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
init: false
ports:
  8080/tcp: 8080
  8088/tcp: 8088
  4865/tcp: 4865
ports_description:
  8080/tcp: "Primary web administration interface"
  8088/tcp: "Secondary web administration interface"
  4865/tcp: "Alternative web administration interface"
webui: "http://[HOST]:[PORT:8080]/admin/"
schema:
  password: str?
  upstream_dns: str?
  domain: str?
options:
  password: ""
  upstream_dns: "1.1.1.1;1.0.0.1"
  domain: ""
