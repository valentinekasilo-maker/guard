name: Guard
version: "6.6.0"
slug: guard
description: "Network-wide ad and tracker blocking powered by Pi-hole"
url: "https://github.com/valentinekasilo-maker/guard"
panel_icon: mdi:shield-check
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
init: false
ports:
  53/tcp: 53
  53/udp: 53
  80/tcp: 8080
ports_description:
  53/tcp: "DNS TCP port"
  53/udp: "DNS UDP port"
  80/tcp: "Web administration interface"
webui: "http://[HOST]:8080/admin/"
schema:
  password: str?
  upstream_dns: str?
options:
  password: ""
  upstream_dns: "1.1.1.1;1.0.0.1"
